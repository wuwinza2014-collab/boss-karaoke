<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>老闆卡拉OK</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif; padding:24px; line-height:1.7;}
    .card{max-width:860px;margin:auto;border:1px solid #e5e7eb;border-radius:14px;padding:18px 20px; box-shadow:0 6px 18px rgba(0,0,0,.06);}
    h1{margin:0 0 8px;}
    .tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#f3f4f6;margin-right:8px;font-size:14px;}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #d1d5db;font-size:16px;}
    ul{padding-left:18px;}
    footer{opacity:.7;margin-top:16px;font-size:13px;}
  </style>
</head>
<body>
  <div class="card">
    <h1>🎤 老闆卡拉OK</h1>
    <div>
      <span class="tag">日本演歌</span>
      <span class="tag">歌單整理</span>
      <span class="tag">練唱記錄</span>
    </div>

    <p>網站已啟動。下一步：上傳歌單（CSV），就能做「搜尋＋點歌＋已唱標記」。</p>

    <h3>🔎 先放一個搜尋框（之後會真的連到歌單）</h3>
    <input placeholder="輸入歌名 / 歌手 / 編號（例如：冬景色）" />

    <h3>✅ 接下來你要做的兩件事</h3>
    <ul>
      <li>上傳歌單檔：<b>songs.csv</b>（我會給你一鍵格式）</li>
      <li>我幫你做點歌介面：可查詢、可排序、可記錄已唱</li>
    </ul>

    <footer>老闆出手，歌單有路；一按即唱，唱過不忘。</footer>
  </div>
</body>
</html>
